<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EXPO INVESTMENT - Admin Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#0f0f0f;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    color:#fff;
}

.background{
    position:fixed;
    inset:0;
    background:
    radial-gradient(circle at top,#f4c43033,transparent 45%),
    radial-gradient(circle at bottom,#d4af3722,transparent 45%),
    #0f0f0f;
    z-index:-1;
}

.login-container{
    width:100%;
    max-width:430px;
    padding:20px;
}

.logo-box{
    text-align:center;
    margin-bottom:25px;
}

.logo{
    width:90px;
    height:90px;
    margin:auto;
    border-radius:50%;
    background:linear-gradient(135deg,#FFD700,#B8860B);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:42px;
    box-shadow:0 0 30px rgba(255,215,0,.5);
}

.logo-box h1{
    margin-top:18px;
    font-size:28px;
    color:#FFD700;
    letter-spacing:1px;
}

.logo-box p{
    color:#cccccc;
    margin-top:8px;
    font-size:14px;
}

.login-card{
    background:#181818;
    border:1px solid rgba(255,215,0,.25);
    border-radius:20px;
    padding:30px;
    box-shadow:0 20px 50px rgba(0,0,0,.45);
}

.login-card h2{
    text-align:center;
    color:#FFD700;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#aaa;
    margin-bottom:25px;
    font-size:14px;
}

.input-group{
    margin-bottom:20px;
}

.input-group label{
    display:block;
    margin-bottom:8px;
    color:#FFD700;
    font-weight:bold;
}

.input-group input{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1px solid #444;
    background:#252525;
    color:white;
    font-size:15px;
    transition:.3s;
}

.input-group input:focus{
    outline:none;
    border-color:#FFD700;
    box-shadow:0 0 12px rgba(255,215,0,.35);
}

.remember{
    margin-bottom:20px;
    color:#ccc;
    font-size:14px;
}

.remember input{
    margin-right:8px;
}

.login-btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#FFD700,#B8860B);
    color:#111;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.login-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 25px rgba(255,215,0,.4);
}

.message{
    margin-top:18px;
    text-align:center;
    font-weight:bold;
    min-height:22px;
}

.footer{
    margin-top:25px;
    text-align:center;
    color:#999;
    font-size

</style>

</head>

<body>

<div class="background"></div>

<div class="login-container">

    <div class="logo-box">
        <div class="logo">👑</div>

        <h1>EXPO INVESTMENT</h1>

        <p>Administrator Control Panel</p>
    </div>

    <div class="login-card">

        <h2>Admin Login</h2>

        <p class="subtitle">
            Sign in to access the administrator dashboard.
        </p>

        <form id="adminLoginForm">

            <div class="input-group">

                <label>Email Address</label>

                <input
                    type="email"
                    id="adminEmail"
                    placeholder="Enter administrator email"
                    required>

            </div>

            <div class="input-group">

                <label>Password</label>

                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Enter administrator password"
                    required>

            </div>

            <div class="remember">

                <label>

                    <input
                        type="checkbox"
                        id="remember">

                    Remember me

                </label>

            </div>

            <button
                type="submit"
                class="login-btn">

                🔐 LOGIN

            </button>

            <div
                id="loginMessage"
                class="message">
            </div>

        </form>

    </div>

    <div class="footer">

        © 2026 EXPO INVESTMENT

        <br>

        Secure Administrator Portal

    </div>

</div>

<script>

// ======================================
// EXPO INVESTMENT ADMIN LOGIN
// ======================================

// Change these to your own admin credentials
const ADMIN_EMAIL = "expoinvestment@gmail.com";
const ADMIN_PASSWORD = "Expo@2026";

// If already logged in, go straight to dashboard
if (localStorage.getItem("adminLoggedIn") === "true") {
    window.location.href = "admin-dashboard.html";
}

document.getElementById("adminLoginForm").addEventListener("submit", function(e){

    e.preventDefault();

    const email = document.getElementById("adminEmail").value.trim();
    const password = document.getElementById("adminPassword").value.trim();
    const remember = document.getElementById("remember").checked;
    const message = document.getElementById("loginMessage");

    message.style.color = "#ff4d4d";

    if(email === ""){
        message.innerHTML = "Enter administrator email.";
        return;
    }

    if(password === ""){
        message.innerHTML = "Enter administrator password.";
        return;
    }

    if(email !== ADMIN_EMAIL || password !== ADMIN_PASSWORD){
        message.innerHTML = "Invalid administrator credentials.";
        return;
    }

    // Login successful
    localStorage.setItem("adminLoggedIn","true");

    if(remember){
        localStorage.setItem("adminRemember","true");
    }else{
        localStorage.removeItem("adminRemember");
    }

    message.style.color="#22c55e";
    message.innerHTML="Login successful...";

    setTimeout(function(){
        window.location.href="admin-dashboard.html";
    },1000);

});

// Logout function (can be called from dashboard)
function adminLogout(){

    localStorage.removeItem("adminLoggedIn");

    window.location.href="admin-login.html";

}

</script>

</body>
</html>
