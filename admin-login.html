<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EXPO INVESTMENT - Admin Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

/* ===== PART 1B CSS WILL GO HERE ===== */

<body>

<div class="background"></div>

<div class="login-container">

    <div class="logo-box">
        <div class="logo">👑</div>

        <h1>EXPO INVESTMENT</h1>

        <p>Administrator Control Panel</p>
    </div>

    <div class="login-card">

        <h2>Admin Login</h2>

        <p class="subtitle">
            Sign in to access the administrator dashboard.
        </p>

        <form id="adminLoginForm">

            <div class="input-group">

                <label>Email Address</label>

                <input
                    type="email"
                    id="adminEmail"
                    placeholder="Enter administrator email"
                    required>

            </div>

            <div class="input-group">

                <label>Password</label>

                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Enter administrator password"
                    required>

            </div>

            <div class="remember">

                <label>

                    <input
                        type="checkbox"
                        id="remember">

                    Remember me

                </label>

            </div>

            <button
                type="submit"
                class="login-btn">

                🔐 LOGIN

            </button>

            <div
                id="loginMessage"
                class="message">
            </div>

        </form>

    </div>

    <div class="footer">

        © 2026 EXPO INVESTMENT

        <br>

        Secure Administrator Portal

    </div>

</div>
