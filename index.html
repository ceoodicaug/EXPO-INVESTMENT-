<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EXPO INVESTMENT - Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f5f7fa;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.container{width:100%;max-width:420px}
.logo{text-align:center;margin-bottom:25px}
.logo h1{color:#1e3a8a}
.logo p{color:#666}
.card{background:#fff;padding:25px;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.12)}
input{width:100%;padding:14px;margin:8px 0;border:1px solid #ccc;border-radius:8px}
button{width:100%;padding:14px;border:none;border-radius:8px;background:#2563eb;color:#fff;font-weight:bold;cursor:pointer}
button:hover{background:#1d4ed8}
.switch{text-align:center;margin-top:15px}
.switch a{text-decoration:none;color:#2563eb}
.hidden{display:none}
.customer-service{position:fixed;right:20px;bottom:90px;background:#0088cc;color:#fff;padding:14px 18px;border-radius:40px;text-decoration:none;box-shadow:0 4px 12px rgba(0,0,0,.3)}
</style>
</head>
<body>

<div class="container">
<div class="logo">
<h1>EXPO INVESTMENT</h1>
<p>Technology Changes Life</p>
</div>

<div class="card">

<div id="loginForm">
<input type="email" id="loginEmail" placeholder="Email">
<input type="password" id="loginPassword" placeholder="Password">
<button onclick="login()">Login</button>
<div class="switch">Don't have an account? <a href="#" onclick="showRegister()">Register</a></div>
</div>

<div id="registerForm" class="hidden">
<input type="text" id="firstName" placeholder="First Name">
<input type="text" id="lastName" placeholder="Last Name">
<input type="email" id="registerEmail" placeholder="Email">
<input type="password" id="registerPassword" placeholder="Password">
<button onclick="register()">Create Account</button>
<div class="switch">Already have an account? <a href="#" onclick="showLogin()">Login</a></div>
</div>

</div>
</div>

<a href="https://t.me/expoug" class="customer-service" id="supportBtn" target="_blank">💬 Customer Service</a>

<script>
function showRegister(){
loginForm.classList.add("hidden");
registerForm.classList.remove("hidden");
}
function showLogin(){
registerForm.classList.add("hidden");
loginForm.classList.remove("hidden");
}

function register(){
const firstName=firstName=document.getElementById("firstName").value.trim();
const lastName=document.getElementById("lastName").value.trim();
const email=document.getElementById("registerEmail").value.trim().toLowerCase();
const password=document.getElementById("registerPassword").value.trim();

if(!firstName||!email||!password){alert("Fill all required fields");return;}

if(localStorage.getItem("user_"+email)){
alert("This email is already registered.");
showLogin();
return;
}

const user={
id:Date.now(),
firstName,lastName,email,password,
balance:0,
totalDeposits:0,
totalWithdrawals:0,
investments:[],
status:"Active",
joined:new Date().toLocaleString()
};

localStorage.setItem("user_"+email,JSON.stringify(user));

let users=JSON.parse(localStorage.getItem("users"))||[];
users.push(user);
localStorage.setItem("users",JSON.stringify(users));

alert("Account created successfully!");
showLogin();
}

function login(){
const email=document.getElementById("loginEmail").value.trim().toLowerCase();
const password=document.getElementById("loginPassword").value.trim();

const savedUser=JSON.parse(localStorage.getItem("user_"+email));

if(!savedUser){alert("User not found");return;}
if(savedUser.password!==password){alert("Invalid password");return;}

localStorage.setItem("currentUser",JSON.stringify(savedUser));
localStorage.setItem("isLoggedIn","true");

window.location.href="home.html";
}
</script>

</body>
</html>
