<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EXPO INVESTMENT - Login & Register</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0b1320;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:350px;
    background:#fff;
    border-radius:10px;
    padding:25px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

.tabs{
    display:flex;
    margin-bottom:20px;
}

.tabs button{
    flex:1;
    padding:12px;
    border:none;
    cursor:pointer;
    font-weight:bold;
    background:#ddd;
}

.tabs button.active{
    background:#0a7d36;
    color:#fff;
}

input{
    width:100%;
    padding:12px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:6px;
}

button.submit{
    width:100%;
    padding:12px;
    background:#0a7d36;
    color:#fff;
    border:none;
    border-radius:6px;
    cursor:pointer;
    margin-top:10px;
}

.form{
    display:none;
}

.form.active{
    display:block;
}
</style>
</head>
<body>

<div class="container">

<div class="tabs">
<button id="regBtn" class="active" onclick="showRegister()">Register</button>
<button id="logBtn" onclick="showLogin()">Login</button>
</div>

<div id="register" class="form active">
<input type="text" id="name" placeholder="Full Name">
<input type="text" id="contact" placeholder="Contact">
<input type="email" id="regEmail" placeholder="Email">
<input type="password" id="regPassword" placeholder="Password">

<button class="submit" onclick="registerUser()">Create Account</button>
</div>

<div id="login" class="form">
<input type="email" id="loginEmail" placeholder="Email">
<input type="password" id="loginPassword" placeholder="Password">

<button class="submit" onclick="loginUser()">Login</button>
</div>

</div>

<script>

function showRegister(){
document.getElementById("register").classList.add("active");
document.getElementById("login").classList.remove("active");

document.getElementById("regBtn").classList.add("active");
document.getElementById("logBtn").classList.remove("active");
}

function showLogin(){
document.getElementById("login").classList.add("active");
document.getElementById("register").classList.remove("active");

document.getElementById("logBtn").classList.add("active");
document.getElementById("regBtn").classList.remove("active");
}

function registerUser(){

let users=JSON.parse(localStorage.getItem("users"))||[];

let user={
name:document.getElementById("name").value,
contact:document.getElementById("contact").value,
email:document.getElementById("regEmail").value,
password:document.getElementById("regPassword").value
};

if(!user.name||!user.contact||!user.email||!user.password){
alert("Please fill all fields.");
return;
}

if(users.find(u=>u.email===user.email)){
alert("Email already exists.");
return;
}

users.push(user);

localStorage.setItem("users",JSON.stringify(users));

alert("Account created successfully!");

showLogin();

}

function loginUser(){

let email=document.getElementById("loginEmail").value;
let password=document.getElementById("loginPassword").value;

let users=JSON.parse(localStorage.getItem("users"))||[];

let user=users.find(u=>u.email===email&&u.password===password);

if(user){

localStorage.setItem("loggedUser",JSON.stringify(user));

alert("Login successful!");

window.location="home.html";

}else{

alert("Invalid email or password.");

}

}

</script>

</body>
</html>
