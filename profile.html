<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Profile</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f5f5f5;
}

.header{
background:linear-gradient(90deg,#0ca63b,#ffd700);
padding:25px;
text-align:center;
color:white;
border-radius:0 0 20px 20px;
}

.avatar{
width:90px;
height:90px;
background:white;
border-radius:50%;
margin:auto;
display:flex;
align-items:center;
justify-content:center;
font-size:45px;
color:#0ca63b;
}

.card{
background:white;
margin:20px;
padding:18px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

button{
width:100%;
padding:15px;
background:#0ca63b;
border:none;
border-radius:10px;
color:white;
font-size:17px;
margin-top:15px;
}
</style>

</head>

<body>

<div class="header">

<div class="avatar">
👤
</div>

<h2 id="name">User</h2>

</div>

<div class="card">
<b>User ID</b><br>
<span id="userid">EXP123456</span>
</div>

<div class="card">
<b>Phone Number</b><br>
<span id="phone">+256700000000</span>
</div>

<div class="card">
<b>Email</b><br>
<span id="email">example@email.com</span>
</div>

<div class="card">
<b>Referral Code</b><br>
<span id="ref">EXP001</span>
</div>

<div class="card">
<button onclick="logout()">Logout</button>
</div>

<script>

document.getElementById("name").innerHTML =
localStorage.getItem("username") || "Investor";

document.getElementById("phone").innerHTML =
localStorage.getItem("phone") || "+256";

document.getElementById("email").innerHTML =
localStorage.getItem("email") || "Not Set";

function logout(){
localStorage.clear();
window.location="login.html";
}

</script>

</body>
</html>
